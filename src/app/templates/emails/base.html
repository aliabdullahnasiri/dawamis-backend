<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}{{ T("brand:name") }}{% endblock %}</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f6f8;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2937;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
      style="background-color: #f4f6f8; padding: 40px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="
              max-width: 600px;
              background-color: #ffffff;
              border-radius: 8px;
              overflow: hidden;
            "
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  padding: 32px;
                  text-align: center;
                  border-bottom: 1px solid #e5e7eb;
                "
              >
                <h1 style="margin: 0; font-size: 28px; color: #111827">
                  {{ T("brand:name") }}
                </h1>

                <p style="margin: 8px 0 0; font-size: 14px; color: #6b7280">
                  {{ T("brand:description") }}
                </p>
              </td>
            </tr>

            <!-- Content -->
            <tr>
              <td style="padding: 40px 32px">
                {% block content %}{% endblock %}
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  padding: 24px 32px;
                  background-color: #f9fafb;
                  border-top: 1px solid #e5e7eb;
                  text-align: center;
                "
              >
                <p style="margin: 0 0 8px; font-size: 13px; color: #9ca3af">
                  &copy; {{ current_year }} Dawamis. {{
                  T("email:all_rights_reserved") }}
                </p>

                <p style="margin: 0; font-size: 12px; color: #9ca3af">
                  {{ T("email:automated_email_do_not_reply") }}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
